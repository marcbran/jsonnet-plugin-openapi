openapi: 3.0.3
info:
  title: List Params
  version: "1"
paths:
  /users:
    get:
      operationId: listUsers
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, suspended]
        - name: include[]
          in: query
          schema:
            type: array
            items:
              type: string
              enum: [teams]
        - name: limit
          in: query
          schema:
            type: integer
        - name: sort
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
